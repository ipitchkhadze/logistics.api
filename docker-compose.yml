services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-logistics}
      DB_USERNAME: ${DB_USERNAME:-logistics}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - logistics
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - logistics
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_DATABASE:-logistics}
      MYSQL_USER: ${DB_USERNAME:-logistics}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - logistics
    restart: unless-stopped

networks:
  logistics:
    driver: bridge

volumes:
  mysql_data:
